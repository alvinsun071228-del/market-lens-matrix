name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    # A data commit pushed by the collector with the default GITHUB_TOKEN does
    # NOT trigger `push` workflows (GitHub suppresses recursive runs). Without
    # this, the scheduled collection updated the data in the repo but the
    # published site never rebuilt — it stayed frozen on the last human push.
    workflows: ["Collect Market Prices"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Never publish data from a failed collection run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
