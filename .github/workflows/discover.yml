name: Discover Market Products
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run discover
      - run: |
          git config user.name "market-lens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery-report.json data/source-catalog.json
          git diff --cached --quiet || git commit -m "chore: update product discovery report"
          git push
