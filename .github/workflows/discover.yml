name: Discover Market Models

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-market-models
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Discover models on sale per market
        run: node scripts/discover.mjs

      - name: Validate the data contract before committing
        run: node scripts/validate.mjs

      - name: Commit discovery output
        run: |
          git config user.name "market-lens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/models.json data/discovery-report.json
          if git diff --cached --quiet; then
            echo "No discovery changes this run."
          else
            git commit -m "chore: update discovered market models"
            git push
          fi
