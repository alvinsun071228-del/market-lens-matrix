name: Collect Market Prices

on:
  schedule:
    # Hourly; budget collect ~2-4 min + commit + Pages rebuild ~1-3 min.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-market-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Refresh FX rates (USD per local unit)
        run: node scripts/fx.mjs

      - name: Collect retailer and brand prices
        run: node scripts/collect.mjs

      - name: Discover models actually on sale per market
        run: node scripts/discover.mjs

      - name: Coverage report (what is on sale where, and what is Amazon-only)
        run: node scripts/coverage.mjs

      - name: Validate the data contract before committing
        run: node scripts/validate.mjs

      - name: Fail on unusable or overdue feed
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const latest = JSON.parse(fs.readFileSync('public/data/latest.json', 'utf8'));
          const fxAsOf = Date.parse(`${latest.fx?.asOf ?? ''}T00:00:00Z`);
          const collectedAt = Date.parse(latest.collectedAt ?? '');
          const now = Date.now();
          const problems = [];
          if (latest.mode !== 'live') problems.push(`mode is ${JSON.stringify(latest.mode)}, expected "live"`);
          if (latest.verifiedProductCount === 0) problems.push('verifiedProductCount is 0');
          if (!Number.isFinite(collectedAt) || now - collectedAt > 6 * 60 * 60 * 1000) problems.push('collectedAt is older than 6 hours');
          if (!Number.isFinite(fxAsOf) || now - fxAsOf > 7 * 24 * 60 * 60 * 1000) problems.push('fx.asOf is older than 7 days');
          if (problems.length) {
            console.error(`Unusable feed: ${problems.join('; ')}`);
            process.exit(1);
          }
          console.log('Feed freshness alarm passed; blocked individual markets remain non-fatal.');
          NODE

      - name: Commit collected data
        run: |
          git config user.name "market-lens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/api data/history data/discovery-report.json docs/COVERAGE.md
          if git diff --cached --quiet; then
            echo "No price changes this run."
          else
            git commit -m "chore: update collected market prices"
            git push
          fi
