name: Collect Market Prices

on:
  schedule:
    # Every six hours; weekly trend points are aggregated from these snapshots.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-market-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Refresh FX rates (USD per local unit)
        run: node scripts/fx.mjs

      - name: Collect retailer and brand prices
        run: node scripts/collect.mjs

      - name: Discover models actually on sale per market
        run: node scripts/discover.mjs

      - name: Validate the data contract before committing
        run: node scripts/validate.mjs

      - name: Commit collected data
        run: |
          git config user.name "market-lens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/api data/history data/discovery-report.json
          if git diff --cached --quiet; then
            echo "No price changes this run."
          else
            git commit -m "chore: update collected market prices"
            git push
          fi
